# Maintains a draft GitHub Release that is kept up-to-date with every push to
# main that touches custom_components/. Pull request labeling is
# handled separately by dedicated PR-safe workflows; this workflow only updates
# release drafts. The draft is populated using the rules in
# .github/release-drafter.yml (categories, version bump strategy, etc.). When a
# release is ready, run release.yml to attach the asset before publishing the draft.
#
# Only stable releases are drafted here. Pre-releases are tagged by hand on the
# head of a feature branch and created with `gh release create --prerelease`;
# see "Pre-releases" in AGENTS.md.
#
# Responsibility split:
#   - pr-labeling.yml sets and validates PR labels.
#   - This workflow turns merged PR metadata into draft releases.
#   - release.yml builds and uploads assets before a draft is published.
name: Release Drafter

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - custom_components/**
      - .github/release-drafter.yml
      - .github/release-drafter-base.yml
      - .github/workflows/release-drafter.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.35). Leave empty to auto-resolve."
        required: false
        type: string

permissions: {}

concurrency:
  group: release-drafter-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: update_release_draft
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@c2e2804cc59f45f57076a99af580d0fedb697927 # v7.3.0
        with:
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
