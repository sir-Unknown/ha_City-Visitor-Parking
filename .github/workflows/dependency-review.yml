# Scans dependency changes in PRs for known vulnerabilities using the GitHub
# Advisory Database. Fails on findings with severity >= moderate and posts a
# summary comment on the PR when issues are found.
#
# Note: allow-ghsas contains temporary exceptions for Pillow, which is pinned to
# 12.3.0 by Home Assistant 2026.10.x (pytest-homeassistant-custom-component).
# All of these advisories are fixed in Pillow 13.0.0, which no
# pytest-homeassistant-custom-component release uses yet. Pillow is only
# installed as part of the test stack. Remove every entry below as soon as the
# test stack moves to Home Assistant 2026.11 or newer.
name: "Dependency review"
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # Required because `comment-summary-in-pr: on-failure` posts a PR comment.
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: "Check for dependency file changes"
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            deps:
              - "pyproject.toml"
              - "uv.lock"
      - name: "Dependency Review"
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'refs/heads/main' }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
          allow-ghsas: >-
            GHSA-22hg-r758-rrw9,
            GHSA-24rc-8hj2-v98c,
            GHSA-254f-3936-288h,
            GHSA-27h8-gf7j-v5hc,
            GHSA-332p-7hrc-92wf,
            GHSA-3j72-p6qg-6xp7,
            GHSA-4558-3h8r-v8xp,
            GHSA-462x-pgg6-55fp,
            GHSA-4rm8-3hmm-39fg,
            GHSA-4rr5-89j8-mwwm,
            GHSA-58r4-6rv3-gfh8,
            GHSA-5x8w-8jj5-q52h,
            GHSA-5xm2-6676-qcp9,
            GHSA-654x-cwwv-5j9c,
            GHSA-65qm-jvmh-6pqg,
            GHSA-74r2-7ff9-mjj2,
            GHSA-78g4-xqwv-q3g8,
            GHSA-7mwm-ghpf-9vrm,
            GHSA-8g5g-8vmr-9782,
            GHSA-9v9v-9qvf-h2hj,
            GHSA-c6hw-5grf-ff96,
            GHSA-cp9v-662q-vvx9,
            GHSA-f2g6-542v-9j58,
            GHSA-fc9g-5qg7-mf45,
            GHSA-g4qv-2jxx-769h,
            GHSA-g7cr-3p24-7wf7,
            GHSA-g842-9rc4-69pw,
            GHSA-gg2r-wvfm-q9rx,
            GHSA-j4m9-6w36-pw47,
            GHSA-jg86-v3jv-hrpm,
            GHSA-mrfp-p49p-3hf2,
            GHSA-p4wg-p73j-c528,
            GHSA-p8hx-v2p6-rp84,
            GHSA-pchr-8j38-3x4p,
            GHSA-q45j-58j2-45rg,
            GHSA-rfgq-q3w2-pmv2,
            GHSA-v9pv-5gc8-w2m6,
            GHSA-vx6w-vv9f-6gvg,
            GHSA-w889-685w-c8fh,
            GHSA-xgh8-jp6q-p5x8,
            GHSA-xvh5-g6gv-559v
          retry-on-snapshot-warnings: true
