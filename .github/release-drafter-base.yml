# Shared Release Drafter settings. The stable (release-drafter.yml) and beta
# (release-drafter-beta.yml) configs inherit this file with `_extends` and only
# set their commitish plus the parts of the release body that differ. Body = header + template + footer.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
no-changes-template: "- No changes in `custom_components/**` since the last release."
exclude-labels:
  - "skip-changelog"
  - "duplicate"
  - "invalid"
exclude-contributors:
  - "sir-Unknown"
  - "dependabot[bot]"
  - "renovate[bot]"
  - "github-actions[bot]"
  - "codex[bot]"
  - "claude[bot]"
sort-direction: ascending
include-paths:
  - "custom_components/"
category-template: "#### $TITLE"
categories:
  - title: "🚨 Breaking changes"
    labels:
      - "breaking-change"
  - title: "✨ New features"
    labels:
      - "new-feature"
  - title: "🐛 Bug fixes"
    labels:
      - "bugfix"
  - title: "🚀 Enhancements"
    labels:
      - "enhancement"
      - "refactor"
      - "performance"
  - title: "🧰 Maintenance"
    labels:
      - "maintenance"
      - "ci"
  - title: "⬆️ Dependency updates"
    labels:
      - "dependencies"
  - title: "🧪 Tests"
    labels:
      - "tests"
  - title: "📚 Documentation"
    labels:
      - "documentation"
version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "minor"
      - "new-feature"
  patch:
    labels:
      - "bugfix"
      - "ci"
      - "dependencies"
      - "documentation"
      - "enhancement"
      - "maintenance"
      - "performance"
      - "refactor"
      - "tests"
  default: patch
header: |+
  > [!IMPORTANT]
  > This integration is under active development. Always verify in the official parking portal that a session was started, updated, or stopped correctly. The maintainer is not responsible for incorrectly registered sessions or resulting fines.

template: |
  $CHANGES
footer: |

  #### Contributors

  $CONTRIBUTORS

  Built with [pyCityVisitorParking](https://github.com/sir-Unknown/pyCityVisitorParking) version: PYCVP_VERSION_PLACEHOLDER

  [Documentation](https://github.com/sir-Unknown/ha_City-Visitor-Parking/wiki) · [Report a bug](https://github.com/sir-Unknown/ha_City-Visitor-Parking/issues/new) · [Full changelog](https://github.com/sir-Unknown/ha_City-Visitor-Parking/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)
