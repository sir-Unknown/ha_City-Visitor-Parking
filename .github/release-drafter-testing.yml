name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
commitish: "testing"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
no-changes-template: "- No changes in `custom_components/**` since the last release."
exclude-labels:
  - "skip-changelog"
  - "duplicate"
  - "invalid"
exclude-contributors:
  - "sir-Unknown"
  - "dependabot[bot]"
  - "renovate[bot]"
  - "github-actions[bot]"
  - "codex[bot]"
  - "claude[bot]"
sort-direction: ascending
include-paths:
  - "custom_components/"
categories:
  - title: "🚨 Breaking changes"
    labels:
      - "breaking-change"
  - title: "✨ New features"
    labels:
      - "new-feature"
  - title: "🐛 Bug fixes"
    labels:
      - "bugfix"
  - title: "🚀 Enhancements"
    labels:
      - "enhancement"
      - "refactor"
      - "performance"
  - title: "🧰 Maintenance"
    labels:
      - "maintenance"
      - "ci"
  - title: "⬆️ Dependency updates"
    labels:
      - "dependencies"
  - title: "🧪 Tests"
    labels:
      - "tests"
  - title: "📚 Documentation"
    labels:
      - "documentation"
template: |
  > [!WARNING]
  > **Testing release, highly unstable.** Only install this if the maintainer asked you to. Not for production use.

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  ## pyCityVisitorParking

  **Commit:** `FILL_IN_COMMIT_SHA`

  Built with [pyCityVisitorParking](https://github.com/sir-Unknown/pyCityVisitorParking) version: PYCVP_VERSION_PLACEHOLDER

  ## Install and rollback

  - **Marketplace (Home Assistant 2026.11+):** **Settings** → **Marketplace** → **City Visitor Parking** → **⋮** → **Install another version**.
  - **HACS (Home Assistant 2026.10):** **HACS** → **City Visitor Parking** → **⋮** → **Redownload**.
  - **Rollback:** restore your backup, or install the latest stable version the same way.

  ## Debug logging

  Add to `configuration.yaml` and restart Home Assistant:

  ```yaml
  logger:
    default: info
    logs:
      custom_components.city_visitor_parking: debug
      pycityvisitorparking.provider: debug
      pycityvisitorparking.provider.dvsportal_new: debug
  ```

  [Documentation](https://github.com/sir-Unknown/ha_City-Visitor-Parking/wiki) · [Report a bug](https://github.com/sir-Unknown/ha_City-Visitor-Parking/issues/new) (attach the diagnostics file) · [Full changelog](https://github.com/sir-Unknown/ha_City-Visitor-Parking/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)
