[project]
name = "ha-city-visitor-parking"
version = "0.0.0"
requires-python = ">=3.14.2"
dependencies = ["pycityvisitorparking==0.6.0b5"]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pre-commit==4.6.0",
  "pymicro-vad==2.0.1",
  "pyright==1.1.409",
  "ruff==0.15.13",
  "types-PyYAML==6.0.12.20260510",
  "zizmor==1.24.1",
]
test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.375",
  "freezegun==1.5.5",
]
perf = [
  "isal==1.8.0",
  "zlib-ng==1.0.0",
]

# ----------------------------
# Mypy configuration
# ----------------------------
[tool.mypy]
python_version = "3.14"
namespace_packages = true
explicit_package_bases = true
mypy_path = "../homeassistant-core"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# ----------------------------
# Pyright configuration
# ----------------------------
[tool.pyright]
include = ["custom_components/city_visitor_parking"]
extraPaths = ["../homeassistant-core", "../pyCityVisitorParking/src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = "none"
reportPrivateImportUsage = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"

# ----------------------------
# Pytest configuration
# ----------------------------
[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

# ----------------------------
# Ruff configuration
# ----------------------------
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "C4", "SIM", "DTZ", "RET", "TCH", "PERF", "RUF", "N", "PL", "ANN"]
ignore = ["D203", "D204", "D213", "D215", "D400", "D401", "D404", "D406", "D407", "D408", "D409", "D413"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------
# uv configuration
# ----------------------------
[tool.uv]
# Home Assistant 2026.10.x (via pytest-homeassistant-custom-component) pins
# Pillow==12.3.0, which carries open advisories fixed in 13.0.0. Pillow is only
# part of the test stack. Remove this override once the test stack moves to
# Home Assistant 2026.11 or newer, which pins Pillow 13.
override-dependencies = ["pillow==13.0.0"]
